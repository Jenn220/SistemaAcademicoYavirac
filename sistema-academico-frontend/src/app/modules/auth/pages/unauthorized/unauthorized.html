<div class="unauthorized-container">
  <div class="unauthorized-card">

    <div class="card-header">
      <h2 class="system-title">Sistema Académico</h2>
      <p class="system-subtitle">Instituto Yavirac</p>
    </div>

    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lock-icon">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h1 class="unauthorized-title">No tienes permiso para ver esto</h1>

    <p class="unauthorized-desc">
      @if (correo) {
        Tu cuenta ({{ correo }}) no tiene el rol necesario para acceder a esta sección.
      } @else {
        No tienes el rol necesario para acceder a esta sección.
      }
    </p>

    <div class="actions">
      <a routerLink="/dashboard" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Volver al inicio</span>
      </a>

      <button type="button" class="btn btn-outline" (click)="cerrarSesion()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>

  </div>
</div>

name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:

  backend:
    name: Backend Build + Migrations

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine

        env:
          POSTGRES_DB: sistema_academico_ci
          POSTGRES_USER: academico_ci
          POSTGRES_PASSWORD: academico_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U academico_ci -d sistema_academico_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: sistema-academico-backend

    env:
      NODE_ENV: test

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sistema_academico_ci
      DB_USER: academico_ci
      DB_PASSWORD: academico_ci_password

      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 1h

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: sistema-academico-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run migrations
        run: npm run migration:run


  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sistema-academico-frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: sistema-academico-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  docker:
    name: Docker Images

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t sistema-academico-backend:ci \
            ./sistema-academico-backend

      - name: Build frontend image
        run: |
          docker build \
            -t sistema-academico-frontend:ci \
            ./sistema-academico-frontend


  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p 1001 -H 161.97.140.245 >> ~/.ssh/known_hosts

      - name: Deploy develop to VPS
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p 1001 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=60 \
            -o TCPKeepAlive=yes \
            -o ConnectTimeout=30 \
            1803980844@161.97.140.245 \
            "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'REMOTE'

          set -euo pipefail

          cd "$HOME/sistema-academico"

          echo "=== Actualizando develop ==="
          git fetch origin develop
          git checkout develop
          git reset --hard origin/develop

          echo "=== Construyendo backend ==="
          docker build \
            -t "ghcr.io/jenn220/sistema-academico-backend:$DEPLOY_SHA" \
            ./sistema-academico-backend

          echo "=== Construyendo frontend ==="
          docker build \
            -t "ghcr.io/jenn220/sistema-academico-frontend:$DEPLOY_SHA" \
            ./sistema-academico-frontend

          echo "=== Cargando variables ==="
          set -a
          . ./.env.production
          set +a

          export IMAGE_TAG="$DEPLOY_SHA"
          export COMMIT_SHA="$DEPLOY_SHA"

          echo "=== Actualizando Docker Swarm ==="
          docker stack deploy \
            --resolve-image never \
            -c docker-stack.prod.yml \
            mate

          echo "=== Esperando servicios ==="
          sleep 20

          docker stack services mate

          echo "=== Comprobando backend ==="
          curl -fsS https://mate.byronrm.com/api/health

          echo
          echo "DEPLOY COMPLETADO: $DEPLOY_SHA"

          REMOTE
name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:

  backend:
    name: Backend Build + Migrations

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine

        env:
          POSTGRES_DB: sistema_academico_ci
          POSTGRES_USER: academico_ci
          POSTGRES_PASSWORD: academico_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U academico_ci -d sistema_academico_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: sistema-academico-backend

    env:
      NODE_ENV: test

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sistema_academico_ci
      DB_USER: academico_ci
      DB_PASSWORD: academico_ci_password

      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 1h

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: sistema-academico-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run migrations
        run: npm run migration:run


  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sistema-academico-frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: sistema-academico-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  docker:
    name: Docker Images

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t sistema-academico-backend:ci \
            ./sistema-academico-backend

      - name: Build frontend image
        run: |
          docker build \
            -t sistema-academico-frontend:ci \
            ./sistema-academico-frontend